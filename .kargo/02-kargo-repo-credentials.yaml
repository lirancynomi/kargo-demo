apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: kargo-demo-repo
  namespace: kargo-demo
  labels:
    kargo.akuity.io/cred-type: git
stringData:
  repoURL: https://github.com/<your-github-username>/kargo-demo
  username: <your-github-username>
  # Use a scoped GitHub PAT (repo scope) or `gh auth token` locally — never commit the real value.
  password: <github-personal-access-token>
